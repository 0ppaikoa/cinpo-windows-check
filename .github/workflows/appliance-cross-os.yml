name: Appliance cross-OS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build appliance on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VENDOR_PASSWORD: ${{ secrets.VENDOR_PASSWORD }}
    steps:
      - name: Check out CINPO v0.5.2
        uses: actions/checkout@v6
        with:
          repository: AokiApp/cinpo
          ref: v0.5.2
          path: cinpo
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download and extract the vendor archives
        shell: pwsh
        run: |
          curl.exe -fsSL -o vendor.zip https://raw.githubusercontent.com/AokiApp/cinpo/v0.5.2/vendor.zip
          if ($LASTEXITCODE -ne 0) { throw 'vendor.zip download failed' }
          New-Item -ItemType Directory -Force -Path cinpo-vendor | Out-Null
          & 'C:\Program Files\7-Zip\7z.exe' x -y "-p$env:VENDOR_PASSWORD" vendor.zip "-o$PWD\cinpo-vendor"
          if ($LASTEXITCODE -ne 0) { throw 'vendor.zip extraction failed' }

      - name: Bootstrap probe and build the appliance
        shell: pwsh
        env:
          CINPO_TEMPLATE_VERSION: 0.5.2
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'cinpo-probe'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\cinpo\scripts\bootstrap.ps1 `
            -Template probe `
            -Name 'sample-probe' `
            -Destination $dest
          if ($LASTEXITCODE -ne 0) { throw "bootstrap.ps1 failed: $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path (Join-Path $dest 'vendor') | Out-Null
          Copy-Item -Path (Join-Path $PWD 'cinpo-vendor\*') -Destination (Join-Path $dest 'vendor') -Recurse -Force

          Push-Location $dest
          try {
            & .\gradlew.bat cinpoJar --console=plain
            if ($LASTEXITCODE -ne 0) { throw "cinpoJar failed: $LASTEXITCODE" }
            & jar tf build\libs\cinpo-appliance.jar |
              Select-String -Pattern 'cinpo-simulator|jcsw|jcsl' |
              Select-Object -First 20 |
              ForEach-Object { Write-Host $_ }
          } finally {
            Pop-Location
          }
          "JAR=$dest\build\libs\cinpo-appliance.jar" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: appliance-windows
          path: ${{ runner.temp }}/cinpo-probe/build/libs/cinpo-appliance.jar
          if-no-files-found: error

  build-linux:
    name: Build appliance on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VENDOR_PASSWORD: ${{ secrets.VENDOR_PASSWORD }}
    steps:
      - name: Check out CINPO v0.5.2
        uses: actions/checkout@v6
        with:
          repository: AokiApp/cinpo
          ref: v0.5.2
          path: cinpo
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download and extract the vendor archives
        run: |
          curl -fsSL -o vendor.zip https://raw.githubusercontent.com/AokiApp/cinpo/v0.5.2/vendor.zip
          mkdir -p cinpo-vendor
          unzip -q -P "$VENDOR_PASSWORD" vendor.zip -d cinpo-vendor

      - name: Bootstrap probe and build the appliance
        run: |
          dest="$RUNNER_TEMP/cinpo-probe"
          ./cinpo/scripts/bootstrap.sh \
            --template probe \
            --version 0.5.2 \
            --name sample-probe \
            "$dest"
          mkdir -p "$dest/vendor"
          cp -a cinpo-vendor/. "$dest/vendor/"
          cd "$dest"
          ./gradlew cinpoJar --console=plain
          jar tf build/libs/cinpo-appliance.jar |
            grep -E 'cinpo-simulator|jcsw|jcsl' |
            head -20
          echo "JAR=$dest/build/libs/cinpo-appliance.jar" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: appliance-linux
          path: ${{ runner.temp }}/cinpo-probe/build/libs/cinpo-appliance.jar
          if-no-files-found: error

  run-linux:
    name: Run the Windows-built JAR on Linux
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/download-artifact@v4
        with:
          name: appliance-windows
          path: appliance

      - name: Run the cross-OS appliance
        run: |
          set +e
          java -jar appliance/cinpo-appliance.jar --debug write --profile jcdksim --task=probe 2>&1 | tee output.log
          code=${PIPESTATUS[0]}
          echo "RESULT windows-jar-on-linux exit=$code"
          exit 0

  run-windows:
    name: Run the Linux-built JAR on Windows
    needs: build-linux
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/download-artifact@v4
        with:
          name: appliance-linux
          path: appliance

      - name: Run the cross-OS appliance
        shell: pwsh
        run: |
          $output = & java -jar appliance\cinpo-appliance.jar --debug write --profile jcdksim --task=probe 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          Write-Host "RESULT linux-jar-on-windows exit=$code"
          exit 0
